<style>
:root{--bg:#030712;--ink:#e6f7ff;--cy:#22d3ee;--cy2:#67e8f9;--line:rgba(34,211,238,.45);color-scheme:dark}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif}
#wrap{position:fixed;inset:0;perspective:1400px;overflow:hidden;background:var(--bg)}
#stage{position:absolute;inset:0;z-index:1;transform-style:preserve-3d;will-change:transform}
svg{display:block;width:100%;height:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}\n#img-mobile{display:none}
#img{opacity:0;transition:opacity 1s}
.building-link{cursor:pointer;outline:none}
/* Gebäude bleiben anklickbar; nur sichtbare Hover-Markierungen sind deaktiviert. */
.building-link{pointer-events:all;cursor:pointer}
.building-link .hs{fill:rgba(0,0,0,0.001) !important;stroke:transparent !important;stroke-width:0 !important;filter:none !important;pointer-events:all}
.building-link:hover .hs,.building-link:focus-visible .hs{fill:rgba(0,0,0,0.001) !important;stroke:transparent !important;stroke-width:0 !important;filter:none !important}
.pulse,.dot,.tag{display:none !important;opacity:0 !important}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(3,7,18,.48) 100%)}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;color:var(--cy2);letter-spacing:.4em;font-size:13px;transition:opacity .9s;pointer-events:none}
.building-link:focus-visible{outline:none}
@media(max-width:820px){
 .tag text{font-size:27px}
 .pulse{stroke-width:3}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.campus-mobile-nav { display:none; }
/* Explicitly select exactly one campus image per device */
#img { display:inline !important; }
#img-mobile { display:none !important; }
/* Mobile campus: vollständige Panoramaansicht plus Touch-Navigation */
@media (max-width: 700px) {
  html, body { width:100%; height:auto; min-height:100%; overflow-x:hidden; overflow-y:auto; overscroll-behavior-y:contain; }
  #wrap { position:fixed; inset:0; width:100%; height:100vh; height:100dvh; min-height:0; overflow:hidden; perspective:none; }
  #stage { position:absolute; inset:0; width:100%; height:100%; aspect-ratio:auto; transform:none !important; will-change:auto; }
  #svg { display:block; width:100%; height:100%; aspect-ratio:auto; touch-action:pan-y; }
  #img { display:none; }
  #svg > rect, #svg > ellipse { display:none !important; }
  #img-mobile { display:inline !important; opacity:1; }
  #img { display:none !important; }
  .mobile-hotspots { display:inline; }
  #hot { display:none; }
  .campus-legal { display:none !important; }
  #fx, #vig { display:none; }
  .tag, .pulse, .dot { display:none !important; }
  .campus-mobile-nav { display:none !important; }
  .campus-mobile-nav a { display:flex; align-items:center; justify-content:center; min-height:52px; padding:11px 9px; border:1px solid rgba(34,211,238,.48); border-radius:10px; background:linear-gradient(145deg,rgba(9,35,54,.98),rgba(3,14,27,.98)); color:#e6f7ff; font:650 13px/1.25 Inter,"Segoe UI",system-ui,sans-serif; text-align:center; text-decoration:none; box-shadow:inset 0 0 18px rgba(34,211,238,.06); -webkit-tap-highlight-color:rgba(34,211,238,.18); }
  .campus-mobile-nav a:last-child { grid-column:1 / -1; }
  .campus-mobile-nav a:active { border-color:#67e8f9; background:rgba(34,211,238,.16); }
  .campus-legal { position:fixed; left:0; right:0; bottom:0; display:flex; flex-wrap:wrap; justify-content:center; gap:18px; padding:12px 12px calc(18px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,rgba(3,7,18,.82)); }
  .campus-legal a { font-size:12px; }
}
@media (max-width:380px) {
  .campus-mobile-nav { gap:8px; padding-left:10px; padding-right:10px; }
  .campus-mobile-nav a { font-size:12px; min-height:48px; }
}

</style>

<script>
(function(){
"use strict";
var W=1672,H=941,svg=document.getElementById("svg"),stage=document.getElementById("stage");
var cv=document.getElementById("fx"),cx=cv.getContext("2d"),P=[];
var V={x:W/2,y:H/2,z:1},mx=0,my=0,sx=null,moved=false,pan=0;
var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
function aspect(){return innerWidth/innerHeight}
function size(){
 var d=Math.min(devicePixelRatio||1,2);
 cv.width=Math.max(1,Math.round(innerWidth*d));
 cv.height=Math.max(1,Math.round(innerHeight*d));
}
size();
for(var i=0;i<70;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.6,v:Math.random()*.00012+.00003,p:Math.random()*6});
window.addEventListener("resize",size);
window.addEventListener("pointermove",function(e){
 mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;
 if(sx!==null&&aspect()<1.6){
  var delta=e.clientX-sx;
  if(Math.abs(delta)>5){moved=true;pan-=delta*(H*aspect()/innerWidth);sx=e.clientX}
 }
});
svg.addEventListener("pointerdown",function(e){sx=e.clientX;moved=false});
window.addEventListener("pointerup",function(){sx=null;setTimeout(function(){moved=false},60)});
function frame(t){
 requestAnimationFrame(frame);
 var ar=aspect();
 if(innerWidth<=700){
  svg.setAttribute("viewBox","0 0 940 1672");
  stage.style.transform="none";
 }else if(ar>=W/H){
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  stage.style.transform="none";
 }else{
  var z=1,hh=H/z,ww=hh*ar;
  if(ww>W/z){ww=W/z;hh=ww/ar}
  var x=Math.max(ww/2,Math.min(W-ww/2,V.x+pan+(reduce?0:mx*14)));
  var y=Math.max(hh/2,Math.min(H-hh/2,V.y+(reduce?0:my*8)));
  svg.setAttribute("viewBox",(x-ww/2)+" "+(y-hh/2)+" "+ww+" "+hh);
  if(!reduce)stage.style.transform="scale(1.025) rotateY("+(mx*1.5)+"deg) rotateX("+(-my*1.0)+"deg)";
 }
 var w=cv.width,h=cv.height;
 cx.clearRect(0,0,w,h);
 if(!reduce)P.forEach(function(q){
  q.y-=q.v*16;if(q.y<-.02){q.y=1.02;q.x=Math.random()}
  var a=.22+.32*Math.sin(t*.002+q.p);
  cx.fillStyle="rgba(103,232,249,"+a+")";
  cx.beginPath();cx.arc(q.x*w+Math.sin(t*.0006+q.p)*14,q.y*h,q.r*(w/1400),0,6.283);cx.fill();
 });
}
requestAnimationFrame(frame);
var im=document.getElementById("img"),load=document.getElementById("load");
function ready(){im.style.opacity=1;load.style.opacity=0;setTimeout(function(){load.style.display="none"},900)}
if(im.complete)ready();else im.addEventListener("load",ready,{once:true});
im.addEventListener("error",function(){load.textContent="CAMPUSBILD KONNTE NICHT GELADEN WERDEN"});
})();
</script>
